      - SP-3 Style Language Selector: prompts/sp-03-style-language-selector.md
      - SP-4 Information Architecture: prompts/sp-04-information-architecture-layout-grid.md
      - SP-5 Component Library Spec: prompts/sp-05-component-library-spec.md
      - SP-6 Functional Mockup Build: prompts/sp-06-functional-mockup-build.md
      - SP-7 Interaction and Motion: prompts/sp-07-interaction-motion-layer.md
      - SP-8 Accessibility and Fidelity QA: prompts/sp-08-accessibility-fidelity-qa.md
      - SP-9 HELM Snapshot: prompts/sp-09-helm-snapshot.md
      - SP-10 Terminal Gate: prompts/sp-10-terminal-gate.md
  - Catalog:
      - Overview: catalog/index.md
      - Command-Console: catalog/command-console.md
      - Tactical HUD: catalog/tactical-hud.md
      - Industrial Terminal: catalog/industrial-terminal.md
      - Vector-Wireframe: catalog/vector-wireframe.md
      - Gestural Holographic: catalog/gestural-holographic.md
      - Hard-Realism Tactical: catalog/hard-realism-tactical.md
      - NASA-Utilitarian: catalog/nasa-utilitarian.md
      - Sonar-Surveillance: catalog/sonar-surveillance.md
