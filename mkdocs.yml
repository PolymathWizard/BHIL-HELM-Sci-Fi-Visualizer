site_name: BHIL-HELM
site_description: Heuristic Engine for Layered Mockups. Sci-fi design-language dashboards, Claude Code friendly, evidence-tiered, IP-clean.
site_url: https://polymathwizard.github.io/BHIL-HELM-Sci-Fi-Visualizer/
repo_url: https://github.com/PolymathWizard/BHIL-HELM-Sci-Fi-Visualizer
repo_name: PolymathWizard/BHIL-HELM-Sci-Fi-Visualizer
copyright: Code and schemas MIT. Content CC BY 4.0. Barry Hurd Intelligence Lab.
docs_dir: docs
strict: true

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/bhil.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - About: about.md
  - Disclaimer: disclaimer.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Operating principles: guide/operating-principles.md
      - Commercial architecture: guide/commercial.md
      - Guardrails: guide/guardrails.md
  - Prompt system:
      - Overview: prompts/index.md
      - Master prompt: prompts/00-master.md
      - SP-1 Data and Input Deconstruction: prompts/sp-01-data-input-deconstruction.md
