name: Prompt refinement
description: A supporting prompt produced a wrong or weak output
labels: [prompts]
body:
  - type: dropdown
    id: prompt
    attributes: {label: Prompt, options: [Master, SP-1, SP-2, SP-3, SP-4, SP-5, SP-6, SP-7, SP-8, SP-9, SP-10]}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: What the prompt produced}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What it should have produced}
    validations: {required: true}
