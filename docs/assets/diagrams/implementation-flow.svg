<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 560' width='1400' height='560'>
<rect width='1400' height='560' fill='#1C1C2E'/>
<text x='40' y='52' fill='#FFFFFF' font-size='30' font-weight='700' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Implementation: one command, four agents, one gate</text>
<text x='40' y='82' fill='#B8BFD6' font-size='16' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>How a HELM build runs inside Claude Code. Each agent has only the tools its job needs. QA runs in a fresh context and can write only the log and the disposition.</text>
<rect x='40' y='130' width='220' height='120' fill='#1B4FD8' stroke='#1B4FD8' stroke-width='1.5' rx='8'/>
<text x='56' y='160' fill='#FFFFFF' font-size='17' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>/helm</text>
<text x='56' y='186' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Client data file plus a</text>
<text x='56' y='206' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>one-line decision question.</text>
<text x='56' y='226' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Reads CLAUDE.md standing brief.</text>
<rect x='300' y='130' width='240' height='120' fill='#0F2F8A' stroke='#6B9EFF' stroke-width='1.5' rx='8'/>
<text x='316' y='160' fill='#FFFFFF' font-size='17' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>helm-profiler</text>
<text x='316' y='186' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>SP-1, SP-2</text>
<text x='316' y='206' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Types the data, names the</text>
<text x='316' y='226' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>reader, writes register.json</text>
<text x='316' y='246' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Tools: read, write register</text>
<line x1='540' y1='190' x2='572' y2='190' stroke='#6B9EFF' stroke-width='2'/><polygon points='572,190 562,185 562,195' fill='#6B9EFF'/>
<rect x='572' y='130' width='240' height='120' fill='#0F2F8A' stroke='#6B9EFF' stroke-width='1.5' rx='8'/>
<text x='588' y='160' fill='#FFFFFF' font-size='17' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>helm-stylist</text>
<text x='588' y='186' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>SP-3, SP-4, SP-5</text>
<text x='588' y='206' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Binds one language with its</text>
<text x='588' y='226' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>rule cited, sets zone budgets</text>
<text x='588' y='246' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Tools: read canonical, tokens</text>
<line x1='812' y1='190' x2='844' y2='190' stroke='#6B9EFF' stroke-width='2'/><polygon points='844,190 834,185 834,195' fill='#6B9EFF'/>
<rect x='844' y='130' width='240' height='120' fill='#0F2F8A' stroke='#6B9EFF' stroke-width='1.5' rx='8'/>
<text x='860' y='160' fill='#FFFFFF' font-size='17' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>helm-builder</text>
<text x='860' y='186' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>SP-6, SP-7</text>
<text x='860' y='206' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Renders dashboard.html from</text>
<text x='860' y='226' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>the template and token file</text>
<text x='860' y='246' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Tools: write artifact only</text>
<line x1='1084' y1='190' x2='1116' y2='190' stroke='#6B9EFF' stroke-width='2'/><polygon points='1116,190 1106,185 1106,195' fill='#6B9EFF'/>
<rect x='1116' y='130' width='240' height='120' fill='#0F2F8A' stroke='#6B9EFF' stroke-width='1.5' rx='8'/>
<text x='1132' y='160' fill='#FFFFFF' font-size='17' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>helm-qa</text>
<text x='1132' y='186' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>SP-8, SP-9, SP-10</text>
<text x='1132' y='206' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Fresh context. Contrast,</text>
<text x='1132' y='226' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>keyboard, labels, tropes</text>
<text x='1132' y='246' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Tools: write log, disposition</text>
<line x1='260' y1='190' x2='292' y2='190' stroke='#6B9EFF' stroke-width='2'/><polygon points='292,190 282,185 282,195' fill='#6B9EFF'/>
<rect x='1130' y='290' width='230' height='60' fill='none' stroke='#3DDC97' stroke-width='2' rx='8'/><text x='1245' y='327' fill='#3DDC97' font-size='16' font-weight='700' text-anchor='middle' font-family='IBM Plex Mono, Consolas, monospace'>APPROVED / BLOCKED</text>
<line x1='1236' y1='250' x2='1236' y2='286' stroke='#6B9EFF' stroke-width='2'/><polygon points='1236,286 1226,281 1226,291' fill='#6B9EFF'/>
<rect x='40' y='300' width='1050' height='110' fill='#0F2F8A' stroke='#6B9EFF' stroke-width='1.5' rx='8'/>
<text x='56' y='330' fill='#FFFFFF' font-size='17' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>engagements/&lt;client&gt;/</text>
<text x='56' y='356' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>dashboard.html   register.json   tokens/&lt;language&gt;.css   CLAUDE.md   REGENERATE.md   .claude/skills/helm-dashboard/SKILL.md</text>
<text x='56' y='376' fill='#B8BFD6' font-size='13' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>The client owns this folder. The next change is a command in their own Claude Code session.</text>
<text x='40' y='455' fill='#FFFFFF' font-size='15' font-weight='700' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>Standing commands after the first build</text>
<rect x='40' y='470' width='250' height='60' fill='#232340' stroke='#6B9EFF' stroke-width='1' rx='6'/><text x='54' y='495' fill='#6B9EFF' font-size='15' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>/rebind</text><text x='54' y='517' fill='#B8BFD6' font-size='12' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>new decision, same data</text>
<rect x='304' y='470' width='250' height='60' fill='#232340' stroke='#6B9EFF' stroke-width='1' rx='6'/><text x='318' y='495' fill='#6B9EFF' font-size='15' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>/restyle</text><text x='318' y='517' fill='#B8BFD6' font-size='12' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>new language, labels survive</text>
<rect x='568' y='470' width='250' height='60' fill='#232340' stroke='#6B9EFF' stroke-width='1' rx='6'/><text x='582' y='495' fill='#6B9EFF' font-size='15' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>/add-panel</text><text x='582' y='517' fill='#B8BFD6' font-size='12' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>one component, budget checked</text>
<rect x='832' y='470' width='250' height='60' fill='#232340' stroke='#6B9EFF' stroke-width='1' rx='6'/><text x='846' y='495' fill='#6B9EFF' font-size='15' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>/snapshot</text><text x='846' y='517' fill='#B8BFD6' font-size='12' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>SP-9 diagnostic</text>
<rect x='1096' y='470' width='250' height='60' fill='#232340' stroke='#6B9EFF' stroke-width='1' rx='6'/><text x='1110' y='495' fill='#6B9EFF' font-size='15' font-weight='700' font-family='IBM Plex Mono, Consolas, monospace'>/gate</text><text x='1110' y='517' fill='#B8BFD6' font-size='12' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif'>re-run QA in fresh context</text>
</svg>